version: 2

models:
    - name: stg_orders
      description: '{{ doc("stg_orders_description") }}'
      columns:
        - name: order_id
          description: '{{ doc("stg_orders_order_id_description") }}'
          tests:
            - not_null
            - unique
        - name: customer_id
          description: '{{ doc("stg_orders_customer_id_description") }}'
          tests:
            - not_null
            - relationships:
                to: ref("stg_customers")
                field: customer_id
        - name: order_date
          description: '{{ doc("stg_orders_order_date_description") }}'
          tests:
            - not_null
        - name: store_id
          description: '{{ doc("stg_orders_store_id_description") }}'
          tests:
            - not_null